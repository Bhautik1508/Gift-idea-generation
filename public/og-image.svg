<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1200" height="630" fill="#FCFAF8"/>
  
  <!-- Subtle Grid Pattern -->
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#E5E0DA" strokeWidth="0.5" strokeOpacity="0.5"/>
    </pattern>
  </defs>
  <rect width="1200" height="630" fill="url(#grid)"/>

  <!-- Logo mark -->
  <g transform="translate(480, 160)">
    <circle cx="120" cy="120" r="100" fill="#1A5CFF" fillOpacity="0.1"/>
    <circle cx="120" cy="120" r="70" fill="#1A5CFF" fillOpacity="0.2"/>
    <!-- Gift box shape abstract -->
    <path d="M120 70 L160 95 L120 120 L80 95 Z" fill="#1A5CFF" />
    <path d="M80 95 L80 145 L120 170 L120 120 Z" fill="#1347CF" />
    <path d="M160 95 L160 145 L120 170 L120 120 Z" fill="#1A5CFF" fillOpacity="0.8" />
  </g>

  <!-- Typography -->
  <text x="600" y="380" fontFamily="-apple-system, BlinkMacSystemFont, Playfair Display, serif" fontSize="84" fontWeight="bold" fill="#1C1B1A" textAnchor="middle">
    GiftSense
  </text>
  <text x="600" y="450" fontFamily="-apple-system, BlinkMacSystemFont, DM Sans, sans-serif" fontSize="32" fill="#5E5C5A" textAnchor="middle">
    The right gift is already in your head. Let's find it.
  </text>
  
  <!-- Accent Line -->
  <line x1="500" y1="520" x2="700" y2="520" stroke="#1A5CFF" strokeWidth="4" strokeLinecap="round"/>
</svg>
